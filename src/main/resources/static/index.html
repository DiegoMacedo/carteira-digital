<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carteira Digital - e-Wallet</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 30px auto; padding: 20px; background: #f5f7fa; }
        .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; font-size: 22px; color: #1e293b; }
        h2 { margin-top: 22px; margin-bottom: 6px; font-size: 16px; color: #1e293b; border-top: 1px solid #e2e8f0; padding-top: 16px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #334155; font-size: 14px; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; }
        button { margin-top: 12px; padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: #fff; }
        #btnConsultar { background: #2563eb; }
        #btnDepositar { background: #16a34a; }
        #btnTransferir { background: #7c3aed; }
        .resultado { margin-top: 18px; padding: 12px; border-radius: 4px; background: #f1f5f9; }
        #mensagem { margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h1>Carteira Digital (e-Wallet)</h1>

    <label for="contaId">ID da Conta:</label>
    <input type="number" id="contaId" value="1">
    <button id="btnConsultar" type="button" onclick="consultarSaldo()">Consultar Saldo</button>

    <h2>Depósito</h2>
    <label for="valorDeposito">Valor do Depósito (R$):</label>
    <input type="number" step="0.01" id="valorDeposito" placeholder="Ex: 250.00">
    <button id="btnDepositar" type="button" onclick="realizarDeposito()">Realizar Depósito</button>

    <h2>Transferência</h2>
    <label for="idOrigem">Conta de Origem (ID):</label>
    <input type="number" id="idOrigem" value="1">

    <label for="idDestino">Conta de Destino (ID):</label>
    <input type="number" id="idDestino" value="2">

    <label for="valorTransferencia">Valor da Transferência (R$):</label>
    <input type="number" step="0.01" id="valorTransferencia" placeholder="Ex: 300.00">
    <button id="btnTransferir" type="button" onclick="realizarTransferencia()">Realizar Transferência</button>

    <div class="resultado">
        <div>Saldo da conta consultada: R$ <span id="saldoAtual">--</span></div>
        <div id="mensagem"></div>
    </div>
</div>

<script>
    async function consultarSaldo() {
        const id = document.getElementById('contaId').value;
        const resposta = await fetch(`/api/contas/${id}/saldo`);
        const dados = await resposta.json();

        if (resposta.ok) {
            document.getElementById('saldoAtual').textContent = Number(dados.saldo).toFixed(2);
            document.getElementById('mensagem').textContent = 'Saldo consultado com sucesso.';
        } else {
            document.getElementById('mensagem').textContent = dados.erro;
        }
    }

    async function realizarDeposito() {
        const id = document.getElementById('contaId').value;
        const valor = document.getElementById('valorDeposito').value;
        const resposta = await fetch(`/api/contas/${id}/deposito?valor=${valor}`, { method: 'POST' });
        const dados = await resposta.json();

        if (resposta.ok) {
            document.getElementById('saldoAtual').textContent = Number(dados.saldo).toFixed(2);
            document.getElementById('mensagem').textContent = dados.mensagem;
        } else {
            document.getElementById('mensagem').textContent = dados.erro;
        }
    }

    async function realizarTransferencia() {
        const idOrigem = document.getElementById('idOrigem').value;
        const idDestino = document.getElementById('idDestino').value;
        const valor = document.getElementById('valorTransferencia').value;

        const resposta = await fetch(
            `/api/contas/transferencia?idOrigem=${idOrigem}&idDestino=${idDestino}&valor=${valor}`,
            { method: 'POST' }
        );
        const dados = await resposta.json();

        if (resposta.ok) {
            document.getElementById('contaId').value = idOrigem;
            await consultarSaldo();
            document.getElementById('mensagem').textContent = dados.mensagem;
        } else {
            document.getElementById('mensagem').textContent = dados.erro;
        }
    }
</script>
</body>
</html>
